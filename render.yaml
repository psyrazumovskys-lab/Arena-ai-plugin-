services:
  - type: worker
    name: psy-workbook-bot
    env: python
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python bot/main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BASE_WEB_URL
        value: https://psyrazumovskys-lab.github.io/Arena-ai-plugin-/therapy-workbooks
